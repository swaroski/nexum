# Local gateway with a persistent volume. First start initializes the
# organization in the volume; edit trust.yaml / policy.yaml there afterwards.
#   NEXUM_DOMAIN=example.com docker compose -f deploy/docker/docker-compose.yml up
services:
  nexum:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: nexum:dev
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /data/nexum.yaml ] || nexum init --domain "$${NEXUM_DOMAIN:-example.com}" --dir /data --listen 0.0.0.0:8080
        exec nexum gateway start
    environment:
      NEXUM_DOMAIN: ${NEXUM_DOMAIN:-example.com}
      RUST_LOG: info
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nexum-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  nexum-data:
