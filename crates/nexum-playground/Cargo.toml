[package]
name = "nexum-playground"
description = "Nexum's decision pipeline compiled to WebAssembly for the browser playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexum-core.workspace = true
nexum-grant.workspace = true
nexum-policy.workspace = true
nexum-sim.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Randomness for throwaway keys comes from the browser's crypto.getRandomValues
# through a plain wasm import; see src/wasm.rs.
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
getrandom = "0.4"
uuid = { workspace = true, features = ["rng-getrandom"] }

# Not `workspace = true`: the wasm ABI shim (src/wasm.rs, wasm32 only) needs a
# few lines of `unsafe`. Everything else in this crate, and every runtime
# crate, keeps `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
