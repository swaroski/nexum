[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/swaroski/nexum"

[workspace.dependencies]
nexum-core = { path = "crates/nexum-core", version = "0.1.0" }
nexum-grant = { path = "crates/nexum-grant", version = "0.1.0" }
nexum-policy = { path = "crates/nexum-policy", version = "0.1.0" }
nexum-audit = { path = "crates/nexum-audit", version = "0.1.0" }
nexum-gateway = { path = "crates/nexum-gateway", version = "0.1.0" }
nexum-sim = { path = "crates/nexum-sim", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

# Browser playground: `cargo build --profile wasm --target wasm32-unknown-unknown -p nexum-playground`
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
