name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.87", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Cross-company demo
        run: ./examples/cross-company/demo.sh

  wasm:
    name: playground wasm builds
    runs-on: ubuntu-latest
    env:
      # An env RUSTFLAGS replaces .cargo/config.toml's target rustflags, so
      # repeat the getrandom backend cfg here.
      RUSTFLAGS: -D warnings --cfg getrandom_backend="custom"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile wasm --target wasm32-unknown-unknown -p nexum-playground

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t nexum:ci .

  action:
    name: eval GitHub Action (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Official suite passes
        uses: ./
        with:
          config: evals/gateway/nexum.yaml
          paths: evals
      - name: "Weaken the policy: allow refunds over 5000"
        run: |
          sed -i 's/refund-ceiling, action: refund.create, effect: deny/refund-ceiling, action: refund.create, effect: allow/' evals/gateway/policy.yaml
          grep -q "refund-ceiling.*effect: allow" evals/gateway/policy.yaml
      - name: The weakened policy is blocked
        id: weakened
        continue-on-error: true
        uses: ./
        with:
          config: evals/gateway/nexum.yaml
          paths: evals
      - if: steps.weakened.outcome != 'failure'
        run: echo "::error::the Action did not block a policy that leaks authority" && exit 1
